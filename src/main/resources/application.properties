spring.application.name=ChatService

# ======= DATASOURCE =======
spring.datasource.url=jdbc:postgresql://postgres:5432/chat_db
spring.datasource.username=chat_user
spring.datasource.password=chat_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ======= JPA/HIBERNATE =======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======= KAFKA =======
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=chat-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# ======= WEB =======
server.port=8080