<div class="avatar-container">
  <img [src]="preview()" alt="" class="avatar">
  @if (isUploading()) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>
  }
</div>

<div class="upload-container">
  <div dnd class="dropzone" tabindex="0" (keyup.enter)="fileDrop.click()" (fileDropped)="onFileDropped($event)">
    <div class="dropzone-content">
      <svg icon="upload"></svg>
      <span class="medium-text">Перетащите изображение или загрузите</span>
    </div>
    <input tabindex="-1" class="avatar-input" type="file" #fileDrop (change)="fileBrowserHandler($event)" accept="image/*">
  </div>

  @if (error()) {
    <div class="error-message">{{ error() }}</div>
  }

  @if (preview() !== '/assets/images/avatar_placeholder.png') {
    <button class="delete-btn" (click)="deleteAvatar()" [disabled]="isUploading()">
      Удалить аватар
    </button>
  }
</div>
