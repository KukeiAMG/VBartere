<div class="register-container">
  <app-anim-back2></app-anim-back2>
  <form
    class="register-form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <h1 class="h1 mb32">Регистрация</h1>
    <label class="blee--control-label mb16">
      Номер телефона
      <input
        formControlName="phoneNumber"
        class="blee--input"
        type="text"
        placeholder="Введите логин">

    </label>
    <label class="blee--control-label mb16">
      Почта
    <input
      formControlName="email"
      class="blee--input"
      type="text"
      placeholder="Введите почту">
    </label>
    <label class="blee--control-label mb16">
      Код приглашения
      <input
        formControlName="invitedByCode"
        class="blee--input"
        type="text"
        placeholder="(Опционально) Введите код приглашения">
    </label>
    <label class="blee--control-label mb32">
      Пароль
      <div class="password-input">

        <input
          formControlName="password"
          class="blee--input"
          [type]="isPasswordVisible() ? 'text' : 'password'"
          placeholder="Введите пароль"
        >
        <input
          formControlName="password2"
          class="blee--input"
          [type]="isPasswordVisible() ? 'text' : 'password'"
          placeholder="Повторите пароль"
        >
        <button class="password-eye"
                type="button"
                [class.active]="isPasswordVisible()"
                (click) = "isPasswordVisible.set(!isPasswordVisible())">
          <svg width="22" height="22" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M15.406 1.125l-3.229 3.229C14.47 5.834 16 7.969 16 7.969s-3.582 5-8 5c-1.244 0-2.422-.397-3.472-.966l-3.372 3.372-.707-.707 3.2-3.2C1.451 9.997 0 7.969 0 7.969s3.582-5 8-5c1.17 0 2.28.351 3.282.867L14.7.418l.707.707zM8 4.969c.61 0 1.179.182 1.653.496L8.546 6.57a1.5 1.5 0 00-1.943 1.943L5.495 9.622A3 3 0 018 4.968zm-.742 4.304l-1.08 1.08a3 3 0 004.205-4.205l-1.079 1.08a1.5 1.5 0 01-2.046 2.046z" fill="currentColor"></path>
          </svg>
        </button>

      </div>
    </label>


    <button class="btn btn-shadow mb20" type="submit">Зарегистрироваться</button>

    <div *ngIf="passwordMismatchError" class="alert alert-danger">
      {{ passwordMismatchError }}
    </div>

    <a [routerLink]="['/login']" class="btn btn-shadow standard-btn">
      Логин
    </a>
  </form>
  <img src="/assets/images/barterleeinv.png" alt="logo">
</div>
